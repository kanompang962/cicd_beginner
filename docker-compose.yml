version: '3.8'

services:
  # .NET 8 API Backend
  api:
    build:
      context: ./api  # path to your .NET API project folder
      dockerfile: Dockerfile
    container_name: cicd-beginner-api
    ports:
      - "5001:8080"  # เปลี่ยนเป็น 5001 ตาม nginx config
    environment:
      - ASPNETCORE_ENVIRONMENT=Production  # เปลี่ยนเป็น Production
      - ASPNETCORE_URLS=http://+:8080
      - CORS_ORIGINS=https://cicd-beginner.tainchaidev.online,http://localhost:3001
    networks:
      - cicd_beginner-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/ || wget -q --spider http://localhost:8080/ || timeout 5s bash -c '</dev/tcp/localhost/8080' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
  # Angular 20 Frontend  
  web:
    build:
      context: ./web  # path to your Angular project folder
      dockerfile: Dockerfile
      args:
        - API_URL=https://cicd-beginner.tainchaidev.online/api
    container_name: cicd-beginner-web
    ports:
      - "3001:80"  # เปลี่ยนเป็น 3001 ตาม nginx config
    depends_on:
      api:
        condition: service_healthy
    networks:
      - cicd_beginner-network
    environment:
      - NODE_ENV=production
    restart: unless-stopped

networks:
  cicd_beginner-network:
    driver: bridge