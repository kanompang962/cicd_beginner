# /opt/projects/cicd_beginner/docker-compose.prod.yml
version: '3.8'

services:
  # .NET 8 API Backend
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
      args:
        - ASPNETCORE_ENVIRONMENT=Production
    container_name: cicd-beginner-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:8080"  # bind เฉพาะ localhost
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - CORS_ORIGINS=https://cicd-beginner.tainchaidev.online
      # - DATABASE_CONNECTION=${DATABASE_CONNECTION:-}
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-this}
      - API_BASE_URL=https://cicd-beginner-api.tainchaidev.online
    networks:
      - cicd_beginner_network
    volumes:
      - api_logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "com.docker.compose.project=cicd-beginner"
      - "com.docker.compose.service=api"

  # Angular 20 Frontend
  web:
    build:
      context: ./web
      dockerfile: Dockerfile.prod
      args:
        - API_URL=https://cicd-beginner-api.tainchaidev.online
        - ENVIRONMENT=production
    container_name: cicd-beginner-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:80:80"  # bind เฉพาะ localhost
    depends_on:
      api:
        condition: service_healthy
    networks:
      - cicd_beginner_network
    volumes:
      - web_logs:/var/log/nginx
    environment:
      - NODE_ENV=production
      - API_URL=https://cicd-beginner-api.tainchaidev.online
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/health || wget -q --spider http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "com.docker.compose.project=cicd-beginner"
      - "com.docker.compose.service=web"

volumes:
  api_logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/reverse-proxy/logs/apps/api
  web_logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/reverse-proxy/logs/apps/web

networks:
  cicd_beginner_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16